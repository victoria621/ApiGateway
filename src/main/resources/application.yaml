server:
  port: 8084

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/users/**
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: mySuperSecretKey1234567890123456789012345678901234567890